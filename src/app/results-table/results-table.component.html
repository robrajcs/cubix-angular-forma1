<div class="container">
  <table>
    <thead>
      <tr>
        <th>FUTAM</th>
        <th>DÁTUM</th>
        <th>GYŐZTES</th>
        <th>CSAPAT</th>
        <th>KÖRÖK SZÁMA</th>
      </tr>
    </thead>

    <tbody>
      @for (
        result of results;
        track result.grandPrix;
        let odd = $odd;
        let even = $even;
        let id = $index
      ) {
        <tr
          [ngClass]="{ odd: odd, even: even }"
          [class.marked]="id === markedRowId"
          (click)="mark(id)"
        >
          <td>{{ result.grandPrix }}</td>
          <td>{{ result.date | date: "M/d/yy" }}</td>
          <td>{{ result.winner }}</td>
          <td>{{ result.team | uppercase }}</td>
          <td>{{ result.laps }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
