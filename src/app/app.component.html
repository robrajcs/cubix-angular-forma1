<h1>
  <span class="title"> {{ title }}</span>
  <span class="results">EREDMÉNYEK</span>
</h1>

<app-results-table
  [results]="results"
  [(markedRowId)]="markedRowId"
  class="container"
></app-results-table>

@if (markedRowId !== undefined) {
  <app-podium
    [podium]="results[markedRowId].podium"
    (rowUnMarked)="rowUnMarked()"
  ></app-podium>
}
